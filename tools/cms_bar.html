<!--cms-bar-->
<style>
#cmsbar{position:fixed;z-index:60;display:flex;font-family:'Archivo',Helvetica,Arial,sans-serif;transition:transform .35s ease,opacity .35s ease}
#cmsbar a{display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:#1E1C18;background:#FFFFFF;border:0}
#cmsbar a.cal{background:#9A7B2E;color:#FFFFFF}
#cmsbar svg{width:14px;height:14px;flex:none}
@media (max-width:959px){#cmsbar{left:0;right:0;bottom:0;border-top:1px solid #E6DCC4;padding-bottom:env(safe-area-inset-bottom);background:#FFFFFF;transform:translateY(110%)}
#cmsbar a{flex:1;min-height:54px}#cmsbar.on{transform:none}body.cms-has-bar{padding-bottom:58px}}
@media (min-width:960px){#cmsbar{right:28px;bottom:28px;border:1px solid #E6DCC4;box-shadow:0 10px 30px rgba(30,28,24,.10);opacity:0;transform:translateY(12px);pointer-events:none}
#cmsbar a{padding:15px 22px}#cmsbar.on{opacity:1;transform:none;pointer-events:auto}#cmsbar a:hover{filter:brightness(.96)}}
@media print{#cmsbar{display:none}}
</style>
<nav id="cmsbar" aria-label="Contact Charbel Msallem">
<a class="wa" href="https://wa.me/9613729713" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4.5 19.5l1.1-3.9A8 8 0 1 1 8.6 18.6z"/></svg>WhatsApp</a>
<a class="cal" href="https://cal.com/charbelmsallem/concept-call" target="_blank" rel="noopener">Book a call</a>
</nav>
<script>
(function(){var b=document.getElementById('cmsbar');if(!b)return;var q=new URLSearchParams(location.search),
h=(q.get('h')||'').slice(0,60),r=(q.get('r')||'').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,40),t=document.title;
if(!h&&t.indexOf(', in ')>0)h=t.split(', in ')[0];
var city=(location.pathname.match(/mood\/([a-z]+)/)||[])[1]||'';city=city?city.charAt(0).toUpperCase()+city.slice(1):'';
var msg='Hello Charbel, '+(h?h+' here. ':'')+'I would like to talk about '+(city?'a '+city+' campaign.':'our next campaign.');
b.querySelector('.wa').href='https://wa.me/9613729713?text='+encodeURIComponent(msg);
b.querySelector('.cal').href='https://cal.com/charbelmsallem/concept-call?a1='+encodeURIComponent((h?h+' · ':'')+(city||'Concept')+' call')+'&utm_source=bar&utm_campaign='+(r||'direct');
function ev(n){try{window.clarity('event',n)}catch(e){}}
b.querySelector('.wa').addEventListener('click',function(){ev('Bar WhatsApp')});b.querySelector('.cal').addEventListener('click',function(){ev('Bar Book a call')});
document.body.classList.add('cms-has-bar');
function u(){b.classList.toggle('on',window.scrollY>280)}window.addEventListener('scroll',u,{passive:true});u();})();
</script>
<!--/cms-bar-->
